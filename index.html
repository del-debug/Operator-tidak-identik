<script>
    ///Operasi tidak identik
    //Operator ini digunakan untuk membandingkan dua nilai, dan akan menghasilkan nilai true (benar) jika kedua nilai tersebut tidak sama nilainya ATAU tidak sama tipe datanya.

    const angka = 20;
    console.log(angka !== 12);

    //perbedaaan dengan operator identik (===) adalah operator identik akan menghasilkan nilai true jika kedua nilai tersebut sama nilainya DAN sama tipe datanya.
    const umur = 16;
    console.log(umur === 16);
</script>
